<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>GANB FE Workshop Register</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: sticky top bar with tabs; each view is a work surface (form left, live list right) that stacks on narrow screens */
:root{
  --bg:#F1F2EF; --surface:#FFFFFF; --sunk:#E8EAE6; --ink:#1D2226; --muted:#5C656C; --line:#D6D9D3;
  --accent:#B3141C; --accent-ink:#FFFFFF; --tag:#F0C132; --tag-ink:#2A2200;
  --st-received:#3C6A8E; --st-service:#A86A12; --st-ready:#2C7A4B; --st-delivered:#6B7378; --st-bad:#B3141C;
  --warn-bg:#FFF4D6; --warn-ink:#6B4A00; --bad-bg:#FBE3E3; --ok-bg:#E2F1E7;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --logo-bg:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181B; --surface:#1C2125; --sunk:#232A2F; --ink:#E6E9EA; --muted:#9AA3A9; --line:#30383D;
  --accent:#E2474D; --accent-ink:#FFFFFF; --tag:#E2B52C; --tag-ink:#1F1800;
  --st-received:#7FAFD3; --st-service:#E0A34A; --st-ready:#5FC08A; --st-delivered:#9AA3A9; --st-bad:#F07075;
  --warn-bg:#3A3015; --warn-ink:#F2D58A; --bad-bg:#3D1C1E; --ok-bg:#183326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181B; --surface:#1C2125; --sunk:#232A2F; --ink:#E6E9EA; --muted:#9AA3A9; --line:#30383D;
  --accent:#E2474D; --accent-ink:#FFFFFF; --tag:#E2B52C; --tag-ink:#1F1800;
  --st-received:#7FAFD3; --st-service:#E0A34A; --st-ready:#5FC08A; --st-delivered:#9AA3A9; --st-bad:#F07075;
  --warn-bg:#3A3015; --warn-ink:#F2D58A; --bad-bg:#3D1C1E; --ok-bg:#183326; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:16px;height:16px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.1}
.logochip{background:var(--logo-bg);border-radius:6px;padding:3px 6px;display:flex;flex:none}
.logochip img{height:50px;width:auto;display:block}
.brand .bl{border-left:1px solid var(--line);padding-left:10px}
.brand .bl b{display:block;font-family:var(--f-display);font-size:17px;line-height:1.1;white-space:nowrap}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;flex:1 1 auto}
nav.tabs button{font:600 14px var(--f-body);background:none;border:0;color:var(--muted);padding:8px 12px;border-radius:var(--r);cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--sunk);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
nav.tabs button .ct{font:500 11px var(--f-mono);background:var(--line);color:var(--ink);border-radius:9px;padding:1px 6px;margin-left:5px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who select{min-width:150px}
main{padding-block:20px 60px}
.banner{border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink)}
.banner.bad{background:var(--bad-bg);color:var(--st-bad)}
.grid2{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:19px;margin:0 0 4px;font-weight:700;text-wrap:balance}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
h3.sec{font:700 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
h3.sec:first-of-type{border-top:0;padding-top:0;margin-top:4px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.fields .full{grid-column:1/-1}
@media (max-width:420px){.fields{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:60px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.inline{display:flex;gap:6px}
.inline>*{min-width:0}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:400}
.chk input{width:auto}
.chks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.btn{font:600 14px var(--f-body);border-radius:5px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.link{border:0;background:none;color:var(--accent);padding:2px 4px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.tagno{font:500 13px var(--f-mono);background:var(--tag);color:var(--tag-ink);padding:2px 7px;border-radius:3px;white-space:nowrap;letter-spacing:.02em}
.mono{font-family:var(--f-mono);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-received{color:var(--st-received)} .st-in_service{color:var(--st-service)} .st-ready{color:var(--st-ready)} .st-delivered{color:var(--st-delivered)} .st-bad{color:var(--st-bad)}
.alerts{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.alert{font-size:13px;padding:7px 10px;border-radius:5px;background:var(--warn-bg);color:var(--warn-ink)}
.alert.bad{background:var(--bad-bg);color:var(--st-bad)}
.alert.info{background:var(--sunk);color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 200px;width:auto}
.toolbar select{width:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{font:600 13px var(--f-body);border:0;background:var(--surface);color:var(--muted);padding:6px 10px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
.counters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:900px){.counters{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.counters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.counter{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--cc);border-radius:6px;padding:10px 12px;cursor:pointer;color:var(--ink);font-family:var(--f-body);min-width:0}
.counter:hover{background:var(--sunk)}
.counter[aria-pressed="true"]{background:var(--sunk);box-shadow:inset 0 0 0 2px var(--cc)}
.counter b{font:700 32px/1 var(--f-display);color:var(--cc);font-variant-numeric:tabular-nums}
.counter .cl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.counter .cs{font-size:12px;color:var(--muted)}
.c-received{--cc:var(--st-received)} .c-in_service{--cc:var(--st-service)} .c-ready{--cc:var(--st-ready)} .c-condemned{--cc:var(--st-bad)} .c-delivered{--cc:var(--st-delivered)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.t th{font:700 11px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;background:var(--sunk);white-space:nowrap}
table.t td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--sunk)}
table.t td.nw{white-space:nowrap}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px;margin-bottom:4px}
.batch{display:flex;flex-direction:column;gap:0}
.batch .row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.batch .row:first-child{border-top:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:14px}
.stat{display:flex;flex-direction:column}
.stat b{font:700 24px var(--f-display);line-height:1}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dhead .t1{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.2}
.dbody{overflow:auto;padding:4px 18px 18px;flex:1}
.dfoot{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--sunk)}
.tl{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:13px;font-variant-numeric:tabular-nums}
.tl b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dues{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:480px){.dues{grid-template-columns:minmax(0,1fr)}}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:600 12px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:3px 9px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:6px;z-index:40;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-bg);color:var(--st-bad);padding:8px 10px;border-radius:5px;font-size:14px}
.techlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.techlist span{display:inline-flex;gap:6px;align-items:center;background:var(--sunk);padding:4px 8px;border-radius:4px;font-size:14px}
.logo-prev{max-height:60px;max-width:200px;background:#fff;padding:4px;border:1px solid var(--line);border-radius:4px}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.photo{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--sunk);border:1px dashed var(--line);border-radius:6px;padding:10px 12px;margin-bottom:10px}
.photo>div{flex:1 1 220px;min-width:0}
input.filled,select.filled{background:var(--ok-bg)}
input.unsure,select.unsure{background:var(--warn-bg)}
.legend{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin:0 3px 0 6px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}

/* sign-in screen and signed-in user box */
.authwrap{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.authwrap[hidden]{display:none}
.authbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 26px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.authbox h2{margin:0;font-family:var(--f-display);font-size:24px}
.authbox .f input{width:100%}
.authlogo{width:130px;align-self:center;background:#fff;border-radius:8px;padding:6px}
.userbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.userbox .rl{opacity:.75;font-size:12px}
.scanwrap{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:12px}
.scanbox{background:var(--surface);color:var(--ink);border-radius:10px;padding:16px;width:100%;max-width:520px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.scanhead{display:flex;justify-content:space-between;align-items:center}
#sc-cam{width:100%;min-height:200px;background:#000;border-radius:8px;overflow:hidden}
#sc-cam video{width:100%!important;height:auto!important;display:block}
.scanact{display:flex;gap:8px;flex-wrap:wrap}
.sclist{display:flex;flex-direction:column;gap:8px}
.scrow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.scrow select{width:auto;max-width:48%}
</style>

<div id="auth" class="authwrap" hidden>
  <form class="authbox" id="authForm">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------- NFPA 10 reference data ---------- */
const TYPES = {
  abc:   {label:'Dry chemical ABC (stored pressure)', short:'ABC dry chem', hydro:12, six:true,  agent:'ABC dry chemical (MAP)', unit:'lb', dcsp:true},
  bc:    {label:'Dry chemical BC (stored pressure)',  short:'BC dry chem',  hydro:12, six:true,  agent:'BC dry chemical',        unit:'lb', dcsp:true},
  dcss:  {label:'Dry chemical, stainless steel shell',short:'Dry chem SS',  hydro:5,  six:true,  agent:'Dry chemical',           unit:'lb', dcsp:true},
  dccart:{label:'Dry chemical (cartridge-operated)',  short:'Dry chem cart.',hydro:12,six:false, agent:'Dry chemical',           unit:'lb'},
  co2:   {label:'Carbon dioxide (CO₂)',          short:'CO₂',     hydro:5,  six:false, agent:'CO₂',              unit:'lb'},
  water: {label:'Water (stored pressure)',            short:'Water',        hydro:5,  six:false, agent:'Water',                  unit:'gal'},
  mist:  {label:'Water mist',                         short:'Water mist',   hydro:5,  six:false, agent:'Deionized water',        unit:'L'},
  foam:  {label:'AFFF / FFFP foam',                   short:'Foam',         hydro:5,  six:false, agent:'AFFF premix',            unit:'gal'},
  wetk:  {label:'Wet chemical (Class K)',             short:'Wet chem K',   hydro:5,  six:false, agent:'Wet chemical agent',     unit:'L'},
  clean: {label:'Clean agent / halogenated',          short:'Clean agent',  hydro:12, six:true,  agent:'Halotron I',             unit:'lb'},
  powd:  {label:'Dry powder (Class D)',               short:'Class D',      hydro:12, six:true,  agent:'Dry powder',             unit:'lb'},
};
const SERVICES = [
  ['insp','Annual inspection & maintenance'],
  ['recharge','Recharge / refill'],
  ['hydro','Hydrostatic test'],
  ['six','6-year maintenance (breakdown)'],
  ['repair','Repair'],
];
const PARTS = ['Valve O-ring','Valve stem','Pressure gauge','Hose assembly','Nozzle / horn','Safety pin','Tamper seal','Verification collar','Siphon tube','Discharge lever','Bracket','Service tag','Instruction label','Hydro test label'];
const REASONS = ['Failed hydrostatic test','Corrosion / pitting','Dents or mechanical damage','Damaged threads','Obsolete per NFPA 10','Non-rechargeable past 12-year life','Stored-pressure dry chem 1984 or earlier','Missing / illegible nameplate','Other'];
const STATUS = {received:'Received', in_service:'In service', ready:'Ready', delivered:'Delivered'};

/* ---------- state ---------- */
const S = {view:'intake', units:[], clients:[], notes:[], settings:{}, db:null, user:null, downloads:null, canWrite:null, myId:null,
  wsFilter:'open', wsClient:'', wsQuery:'', dnClient:'', dnFrom:'', dnTo:'', intakeClient:'', intakeDate:today(), editClient:null};
const TAB = Math.random().toString(36).slice(2);
const $ = (s,r=document)=>r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nowMonth(){return today().slice(0,7)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const sleep = ms=>new Promise(r=>setTimeout(r,ms));
function toast(msg){const r=$('#toastRoot');r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',2800)}

/* ---------- dates & dues ---------- */
function ym(s){ if(!s) return null; const m=String(s).match(/^(\d{4})-(\d{2})/); return m?{y:+m[1],m:+m[2]}:null }
function addMonths(s,n){const d=ym(s); if(!d) return ''; let t=d.y*12+(d.m-1)+n; return Math.floor(t/12)+'-'+String(t%12+1).padStart(2,'0')}
function maxYM(...a){return a.filter(Boolean).map(x=>String(x).slice(0,7)).sort().pop()||''}
function fmtYM(s){const d=ym(s); if(!d) return '—'; return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.m-1]+' '+d.y}
function nowHM(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function fmtDT(d,t){ return d? fmtDate(d)+(t?' '+t:'') : '—' }
function hoursBetween(d1,t1,d2,t2){ if(!d1||!t1||!d2||!t2) return null; const h=(new Date(d2+'T'+t2)-new Date(d1+'T'+t1))/36e5; return isFinite(h)&&h>=0?h:null }
function fmtDur(h){ if(h==null) return ''; if(h<24) return Math.round(h)+' h'; const d=Math.floor(h/24), r=Math.round(h-d*24); return d+' d'+(r?' '+r+' h':'') }
function lastStamp(u){ return u.status==='delivered'?fmtDT(u.deliveredAt,u.deliveredTime):u.status==='ready'?fmtDT(u.readyAt,u.readyTime):u.status==='in_service'?fmtDT(u.startedAt,u.startedTime):fmtDT(u.received,u.receivedTime) }
function fmtDate(s){ if(!s) return '—'; const [y,m,d]=s.split('-'); return d? d+' '+fmtYM(s).split(' ')[0]+' '+y : fmtYM(s)}
function computeDues(u, svc){
  const t = TYPES[u.type]; if(!t) return {annual:'',hydro:'',six:'',life:''};
  const sd = (svc&&svc.date)||today(); const it=(svc&&svc.items)||{};
  const hydroDoneNow = it.hydro && svc.hydroResult!=='fail';
  const annual = addMonths(sd,12);
  let hydro='', six='', life='';
  if(u.nonRech){ life = u.mfg? addMonths(u.mfg,144):''; }
  else{
    const hb = hydroDoneNow ? sd : (u.lastHydro || u.mfg);
    hydro = hb ? addMonths(hb, t.hydro*12) : '';
    if(t.six){ const sb = maxYM(it.six?sd:null, hydroDoneNow?sd:null, u.lastSix, u.lastHydro, u.mfg); six = sb? addMonths(sb,72):''; }
  }
  return {annual, hydro, six, life};
}
function intakeAlerts(u){
  const out=[]; const t=TYPES[u.type]; const now=nowMonth();
  if(!u.mfg) out.push(['warn','Manufacture date missing. Check the nameplate or cylinder stamp.']);
  if(t && t.dcsp && ym(u.mfg) && ym(u.mfg).y<=1984) out.push(['bad','Stored-pressure dry chemical made 1984 or earlier: NFPA 10 requires removal from service.']);
  if(u.nonRech && u.mfg && addMonths(u.mfg,144)<=now) out.push(['bad','Non-rechargeable unit is past its 12-year life: remove from service.']);
  if(t && !u.nonRech){
    const d=computeDues(u,null);
    if(d.hydro && d.hydro<=now) out.push(['warn','Hydrostatic test due '+fmtYM(d.hydro)+' (every '+t.hydro+' years for this type). Include hydro in this service.']);
    if(d.six && d.six<=now && (!d.hydro || d.six<d.hydro || d.hydro>now)) out.push(['warn','6-year maintenance due '+fmtYM(d.six)+'.']);
  }
  return out;
}

let jsPDFCtor=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function getPDF(){
  if(jsPDFCtor) return jsPDFCtor;
  for(const u of ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js','https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js']){
    try{ await loadScript(u); if(window.jspdf&&window.jspdf.jsPDF){ jsPDFCtor=window.jspdf.jsPDF; return jsPDFCtor } }catch(e){}
  }
  throw new Error('The PDF library could not load. Check the internet connection and try again.');
}
function pdfDoc(J){ const fmt=(S.settings.paper==='a4')?'a4':'letter'; return new J({orientation:'landscape',unit:'pt',format:fmt}) }
const M=34;
function pdfHeader(doc,title,meta){
  const W=doc.internal.pageSize.getWidth(); const st=S.settings; let x=M, y=M;
  if(st.logo){ try{ const h=46, w=Math.min(150, h*(st.logoW||1)/(st.logoH||1)); doc.addImage(st.logo, st.logo.includes('image/png')?'PNG':'JPEG', x, y, w, h); x+=w+12 }catch(e){} }
  doc.setTextColor(20); doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.text(st.company||'Company name', x, y+12);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(70);
  const lines=[st.address, [st.phone&&('Tel '+st.phone), st.email, st.website].filter(Boolean).join('   ')].filter(Boolean);
  let ly=y+25; lines.forEach(l=>{ doc.splitTextToSize(l, 330).forEach(t=>{doc.text(t,x,ly);ly+=10.5}) });
  doc.setTextColor(179,20,28); doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.text(title, W-M, y+14, {align:'right'});
  doc.setTextColor(30); doc.setFontSize(9.5); let my=y+30;
  meta.forEach(([k,v])=>{ doc.setFont('helvetica','bold'); const vw=doc.getTextWidth(String(v)); doc.setFont('helvetica','normal'); doc.text(k, W-M-vw-6, my, {align:'right'}); doc.setFont('helvetica','bold'); doc.text(String(v), W-M, my, {align:'right'}); my+=12 });
  const by=Math.max(ly,my,y+52)+4; doc.setDrawColor(179,20,28); doc.setLineWidth(1.2); doc.line(M,by,W-M,by);
  return by+14;
}
function pdfClient(doc,y,c,extra){
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(110); doc.text('CLIENT', M, y);
  doc.setTextColor(20); doc.setFontSize(10.5); doc.text(c.name||'', M, y+13);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(60);
  let yy=y+25; [c.address, [c.contact, c.phone, c.email].filter(Boolean).join('   ')].filter(Boolean).forEach(l=>{doc.splitTextToSize(l,380).forEach(t=>{doc.text(t,M,yy);yy+=10.5})});
  if(extra&&extra.length){ const W=doc.internal.pageSize.getWidth(); let ey=y; extra.forEach(([k,v])=>{ doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(110);doc.text(k.toUpperCase(), W/2+40, ey); doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(20);doc.text(String(v||'—'), W/2+140, ey); ey+=12 }); yy=Math.max(yy,ey) }
  return yy+8;
}
function pdfTable(doc,y,cols,rows,opt={}){
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(); const avail=W-2*M;
  const tot=cols.reduce((a,c)=>a+c.w,0); const ws=cols.map(c=>c.w/tot*avail); const fs=opt.fs||7.6, lh=fs*1.22, pad=4;
  const head=()=>{ doc.setFillColor(opt.headFill||'#E9EAE6'); doc.rect(M,y,avail,16,'F'); doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(60);
    let x=M; cols.forEach((c,i)=>{ doc.text(c.h.toUpperCase(), x+pad, y+10.5); x+=ws[i] }); y+=16 };
  if(opt.title){ doc.setFont('helvetica','bold'); doc.setFontSize(9.5); if(Array.isArray(opt.titleColor)) doc.setTextColor(...opt.titleColor); else doc.setTextColor(20); doc.text(opt.title, M, y+4); y+=12 }
  head();
  rows.forEach((r,ri)=>{
    doc.setFont('helvetica','normal'); doc.setFontSize(fs);
    const cells=cols.map((c,i)=>doc.splitTextToSize(String(r[i]??''), ws[i]-pad*2));
    const h=Math.max(...cells.map(l=>l.length))*lh+pad*2;
    if(y+h>H-M-(opt.reserve||22)){ doc.addPage(); y=M+6; head(); doc.setFont('helvetica','normal'); doc.setFontSize(fs) }
    if(ri%2===1){ doc.setFillColor('#F6F6F3'); doc.rect(M,y,avail,h,'F') }
    doc.setTextColor(25); let x=M; cells.forEach((l,i)=>{ if(cols[i].mono) doc.setFont('courier','bold'); else doc.setFont('helvetica', cols[i].bold?'bold':'normal'); doc.text(l, x+pad, y+pad+fs*0.85); x+=ws[i] });
    doc.setDrawColor(215); doc.setLineWidth(.4); doc.line(M,y+h,M+avail,y+h); y+=h;
  });
  return y+10;
}
function pdfText(doc,y,text,size=8.5,color=60){ const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(); doc.setFont('helvetica','normal');doc.setFontSize(size); Array.isArray(color)?doc.setTextColor(...color):doc.setTextColor(color); const ls=doc.splitTextToSize(text,W-2*M); if(y+ls.length*size*1.3>H-M-20){doc.addPage();y=M+6} doc.text(ls,M,y); return y+ls.length*size*1.3+4 }
function pdfSign(doc,y,left,right){
  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(); if(y+78>H-M-14){doc.addPage();y=M+20}
  y+=14; const colW=(W-2*M-40)/2;
  [[left,M],[right,M+colW+40]].forEach(([s,x])=>{
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(110);doc.text(s.label.toUpperCase(),x,y);
    doc.setDrawColor(120);doc.setLineWidth(.6);
    const rows=[['Name',s.name||''],['Signature',''],['Date','']]; let yy=y+22;
    rows.forEach(([k,v])=>{ doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(90);doc.text(k,x,yy); doc.line(x+52,yy+1,x+colW,yy+1); if(v){doc.setTextColor(20);doc.setFontSize(9.5);doc.text(v,x+56,yy-2)} yy+=20 });
  });
  return y+80;
}
function pdfFooter(doc,label){ const n=doc.getNumberOfPages(); const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(120); doc.text(label,M,H-18); doc.text('Page '+i+' of '+n,W-M,H-18,{align:'right'}) } }
async function saveFile(name,data){
  try{ const blob=data instanceof Blob?data:new Blob([data],{type:/\.csv$/i.test(name)?'text/csv':'text/plain'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000); toast('Saved '+name); return true }
  catch(e){ toast('Download failed: '+((e&&e.message)||'error')); return false }
}

async function getXLSX(){
  if(XLSXlib) return XLSXlib;
  for(const u of ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js']){
    try{ await loadScript(u); if(window.XLSX){ XLSXlib=window.XLSX; return XLSXlib } }catch(e){} }
  throw new Error('The Excel library could not load. Check the internet connection and try again.');
}
let backingUp=false;

  if(!S.isOwner||!S.db||backingUp) return; backingUp=true; toast('Preparing backup…');
  try{
    const X=await getXLSX(); const wb=X.utils.book_new();

      units.map(u=>{const s=u.svc||{};return [u.tag,clientById(u.clientId).name,STATUS[u.status]||u.status,T(u.type),u.brand,u.model,u.serial,u.cap,u.capUnit,u.mfg,u.lastHydro,u.lastSix,u.nonRech?'Yes':'',u.location,u.arrival,u.ref,u.received,u.receivedTime,u.tech,fmtDT(u.startedAt,u.startedTime).replace('—',''),fmtDT(u.readyAt,u.readyTime).replace('—',''),fmtDT(u.deliveredAt,u.deliveredTime).replace('—',''),u.noteNo,(u.prevNotes||[]).join(', '),svcSummary(u),s.hydroPsi,s.items&&s.items.hydro?s.hydroResult:'',s.agentName,s.agentQty?s.agentQty+' '+(s.agentUnit||''):'',(s.parts||[]).join(', '),s.findings,s.condemned?'Yes':'',s.condemnReason,s.dueAnnual,s.dueHydro,s.dueSix,s.tech].map(v=>v==null?'':v)}),

    add('Clients',['Name','Address','Contact','Phone','Email','Units serviced','In workshop'],[...S.clients].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>[c.name,c.address,c.contact,c.phone,c.email,S.units.filter(u=>u.clientId===c.id).length,S.units.filter(u=>u.clientId===c.id&&u.status!=='delivered').length].map(v=>v==null?'':v)),[40,44,30,12,40,10,10]);
    add('Delivery notes',['No.','Date','Client','Units','Workshop nos','Client ref','Delivered by','Received by','Remarks','Cancelled','Cancelled at','Cancel reason','Replaces','Replaced by'],
      [...S.notes].sort((a,b)=>(a.no||'').localeCompare(b.no||'')).map(n=>[n.no,n.date,clientById(n.clientId).name,n.unitIds.length,n.unitIds.map(id=>(unitById(id)||{}).tag||'?').join(', '),n.clientRef,n.deliveredBy,n.receivedBy,n.remarks,n.cancelled?'Yes':'',n.cancelled?fmtDT(n.cancelledAt,n.cancelledTime):'',n.cancelReason,n.replaces,n.replacedBy].map(v=>v==null?'':v)),[14,11,30,6,40,12,16,16,30,9,16,30,14,14]);
    const st=S.settings; add('Settings',['Setting','Value'],[['Company',st.company],['Address',st.address],['Phone',st.phone],['Email',st.email],['Website',st.website],['Paper',st.paper],['Workshop no. prefix',st.prefix],['Technicians',techs().join(', ')],['Office',office().join(', ')],['Backup made',today()+' '+nowHM()]].map(r=>r.map(v=>v==null?'':v)),[22,60]);
    LG.from='2000-01-01'; LG.to=''; await loadLog();

    LG.from=daysAgo(7); LG.loaded=false;
    const raw=[]; const push=(col,id,obj)=>{ const j=JSON.stringify(obj); const parts=[]; for(let i=0;i<j.length;i+=30000) parts.push(j.slice(i,i+30000)); raw.push([col,id].concat(parts)) };
    S.units.forEach(u=>{const {id,...r}=u; push('units',id,r)}); S.clients.forEach(c=>{const {id,...r}=c; push('clients',id,r)}); S.notes.forEach(n=>{const {id,...r}=n; push('notes',id,r)});

/* ---------- photo reader ---------- */
let photoCtl=null;
function renderPhotoBox(){
  const b=$('#in-photo'); if(!b) return;
  if(!S.imgLimits){ b.hidden=true; b.innerHTML=''; return }
  const n=Math.min(S.imgLimits.maxCount||1,4); b.hidden=false;
  b.innerHTML=`<div class="photo"><div><b>Read nameplate from photo</b><div class="small muted">Photograph the nameplate${n>1?', plus the hydro test label or service tag if it has one (up to '+n+' photos)':''}. Claude fills in the fields below. Check them against the unit before saving.</div></div>
    <label class="btn" for="in-photofile">Take or choose photo</label><input type="file" id="in-photofile" accept="${esc((S.imgLimits.mediaTypes||['image/jpeg','image/png']).join(','))}" ${n>1?'multiple':''} hidden></div><div id="in-photostatus"></div>`;
}
async function shrink(file){
  try{ const bmp=await createImageBitmap(file); const k=Math.min(1,2000/Math.max(bmp.width,bmp.height));
    if(k===1&&file.size<=(S.imgLimits.maxInputBytes||5e6)&&/jpe?g|png/.test(file.type)) return file;
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); const out=await new Promise(r=>c.toBlob(r,'image/jpeg',0.9)); return out||file }catch(e){ return file }
}
const PHOTO_PROMPT=`These photos show one portable fire extinguisher in a service workshop: its nameplate and possibly its hydrostatic test label, service tag or cylinder stamp. Read only what is printed or stamped. Never guess: use null for anything not visible or not legible.
Return only a JSON object with these keys:
"serial": serial number exactly as printed (string),
"brand": manufacturer name,
"model": model number,
"type": one of "abc" (ABC / multipurpose dry chemical, stored pressure), "bc" (BC / regular dry chemical, stored pressure), "dcss" (dry chemical with stainless steel shell), "dccart" (cartridge-operated dry chemical), "co2" (carbon dioxide), "water" (stored-pressure water), "mist" (water mist), "foam" (AFFF or FFFP foam), "wetk" (wet chemical, Class K), "clean" (clean agent or halogenated, e.g. Halotron, FE-36), "powd" (Class D dry powder),
"capacity": agent capacity as a number,
"capacityUnit": "lb", "kg", "gal" or "L",
"mfgDate": manufacture date as "YYYY-MM", or "YYYY" if only the year is shown,
"lastHydro": most recent hydrostatic test date shown, "YYYY-MM" or "YYYY",
"lastSix": most recent 6-year maintenance date shown on a label, "YYYY-MM" or "YYYY",
"nonRechargeable": true if marked non-rechargeable or disposable, false if marked rechargeable, else null,
"unsure": array of the key names you are not confident about,
"note": one short sentence on anything the technician should double-check, or null.`;
async function readPhoto(files){
  const max=Math.min(S.imgLimits.maxCount||1,4); const list=[...files].slice(0,max);
  const st=()=>$('#in-photostatus');
  photoCtl&&photoCtl.abort(); photoCtl=new AbortController(); const ctl=photoCtl;
  st().innerHTML='<div class="alert info">Reading '+list.length+' photo'+(list.length>1?'s':'')+'… <button type="button" class="btn link" id="in-photostop">Stop</button></div>';
  try{
    const blobs=await Promise.all(list.map(shrink));
    const r=await S.sample.json(PHOTO_PROMPT,{images:blobs,signal:ctl.signal,modelTier:'default',cache:false});
    const n=applyPhoto(r);
    const box=st(); if(!box) return;
    box.innerHTML = n ? '<div class="alert info">Filled '+n+' field'+(n>1?'s':'')+'.<span class="legend" style="background:var(--ok-bg)"></span>read clearly<span class="legend" style="background:var(--warn-bg)"></span>check against the unit'+(r&&r.note?'<br>'+esc(r.note):'')+'</div>'
      : '<div class="alert">Nothing could be read from that photo. Take it straight on, close up, without glare, and try again.</div>';
  }catch(e){
    const box=st(); const code=e&&e.code; if(code==='cancelled'){ if(box) box.innerHTML=''; return }
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','images_unavailable'].includes(code)){ S.imgLimits=null; renderPhotoBox(); toast('Photo reading is not available for this account.'); return }
    const msg={image_rejected:'That photo could not be used. Try a JPG or PNG under the size limit.',rate_limited:'Too many photo reads right now. Wait a minute and try again.',session_expired:'Your session expired. Sign in to claude.ai again.',refused:'Claude could not read this photo. Try a different one.',invalid_json:'The reading came back incomplete. Try again.',empty_completion:'Nothing could be read from that photo. Try a closer, sharper photo.'}[code]||'Connection problem while reading the photo. Try again.';
    if(box) box.innerHTML='<div class="alert">'+esc(msg)+'</div>';
  }finally{ const f=$('#in-photofile'); if(f) f.value='' }
}
function applyPhoto(r){
  if(!r||typeof r!=='object') return 0;
  const unsure=new Set(Array.isArray(r.unsure)?r.unsure:[]);
  const ymv=v=>{ if(v==null) return null; v=String(v).trim(); let m=v.match(/^(\d{4})-(\d{1,2})/); if(m&&+m[2]>=1&&+m[2]<=12) return m[1]+'-'+m[2].padStart(2,'0'); m=v.match(/^(\d{4})$/); if(m) return m[1]+'-01'; return null };
  ['mfgDate','lastHydro','lastSix'].forEach(k=>{ if(r[k]!=null&&/^\d{4}$/.test(String(r[k]).trim())) unsure.add(k) });
  let n=0;
  const put=(id,val,key)=>{ if(val==null||val==='') return; const el=$('#'+id); if(!el) return; el.value=val; if(el.value!==String(val)) return; el.classList.remove('filled','unsure'); el.classList.add(unsure.has(key)?'unsure':'filled'); n++ };
  const str=v=>v==null?null:String(v).trim()||null;
  put('in-serial',str(r.serial),'serial'); put('in-brand',str(r.brand),'brand'); put('in-model',str(r.model),'model');
  if(r.type&&TYPES[r.type]){ put('in-type',r.type,'type'); $('#in-capunit').value=TYPES[r.type].unit }
  if(r.capacity!=null&&r.capacity!==''&&!isNaN(+r.capacity)) put('in-cap',String(+r.capacity),'capacity');
  if(['lb','kg','gal','L'].includes(r.capacityUnit)){ const el=$('#in-capunit'); el.value=r.capacityUnit; el.classList.add(unsure.has('capacityUnit')?'unsure':'filled') }
  put('in-mfg',ymv(r.mfgDate),'mfgDate'); put('in-lasthydro',ymv(r.lastHydro),'lastHydro'); put('in-lastsix',ymv(r.lastSix),'lastSix');
  if(typeof r.nonRechargeable==='boolean') $('#in-nonrech').checked=r.nonRechargeable;
  updateIntakeAlerts(); checkSeen();
  return n;
}

function readSvc(){

  s.parts=g('sv-parts').split(',').map(x=>x.trim()).filter(Boolean); s.findings=g('sv-find'); s.condemned=$('#sv-cond')?$('#sv-cond').checked:false; s.condemnReason=g('sv-reason');
  s.dueAnnual=g('sv-dann'); s.dueHydro=g('sv-dhyd'); s.dueSix=$('#sv-dsix')&&!$('#sv-dsix').disabled?g('sv-dsix'):'';
  return s;
}
async function saveSvc(status){
  if(!guardWrite()) return; const u=unitById(D.id); const s=readSvc();
  if(status==='ready'){
    const any=SERVICES.some(([k])=>s.items[k]);
    if(!any&&!s.condemned){toast('Tick at least one service performed, or mark the unit condemned.');return}
    if(!s.tech){toast('Select the technician who did the service.');return}
    if(s.condemned&&!s.condemnReason){toast('Select the reason it is condemned.');return}
    if(s.items.hydro&&s.hydroResult==='fail'&&!s.condemned){toast('A failed hydrostatic test means the unit is condemned. Tick Condemned.');return}
  }
  const patch={svc:s, updatedAt:Date.now(), updatedBy:S.myId||null};
  if(status){ patch.status=status; if(status==='ready'){ patch.readyAt=today(); patch.readyTime=nowHM() } if(status==='in_service'&&!u.startedAt){ patch.startedAt=today(); patch.startedTime=nowHM() } }
  try{ await S.db.doc('units/'+D.id).update(patch);
    const act=status==='ready'?'Marked ready':status==='in_service'?(u.status==='ready'?'Back to in service':'Service started'):'Service saved'; const dd=svcDiff(u.svc,s);
    if(status||dd) logAct(act,u.tag,dd||(status?STATUS[u.status]+' → '+STATUS[status]:''));
    toast(status==='ready'?u.tag+' is ready for delivery':status==='in_service'?u.tag+' is in service':'Saved'); if(status==='ready') closeDrawer(); else drawDrawer() }catch(e){writeErr(e)}
}

$('#v-delivery').addEventListener('click',async e=>{
  const t=e.target;
  if(t.dataset.pdf){ const n=S.notes.find(x=>x.id===t.dataset.pdf); try{await pdfDelivery(n)}catch(err){toast(err.message)} }
  if(t.dataset.cpdf){ const n=S.notes.find(x=>x.id===t.dataset.cpdf); try{await pdfCondemned(n)}catch(err){toast(err.message)} }
  if(t.id==='rs-stop'){ S.reissue=null; dnKey=''; renderDelivery(); return }
  if(t.dataset.cnask){ if(!S.isOwner) return; S.cancelNote=t.dataset.cnask; renderDelivery(); const r=$('#cn-reason'); r&&r.focus(); return }
  if(t.dataset.cnno){ S.cancelNote=null; renderDelivery(); return }
  if(t.dataset.cnyes){
    if(!S.isOwner||!guardWrite()) return; const n=S.notes.find(x=>x.id===t.dataset.cnyes); if(!n||n.cancelled) return;
    const reason=($('#cn-reason').value||'').trim(); if(!reason){ toast('Enter the reason for cancelling.'); $('#cn-reason').focus(); return }
    t.disabled=true;
    try{
      await S.db.doc('notes/'+n.id).update({cancelled:true,cancelledAt:today(),cancelledTime:nowHM(),cancelReason:reason,cancelledBy:S.myId||null});
      for(const id of n.unitIds){ const u=unitById(id); if(!u||u.noteId!==n.id) continue;
        await S.db.doc('units/'+id).update({status:'ready',noteId:null,noteNo:null,deliveredAt:null,deliveredTime:null,prevNotes:(u.prevNotes||[]).concat(n.no),updatedAt:Date.now()}) }
      logAct('Delivery note cancelled',n.no,clientById(n.clientId).name+' · Reason: '+reason);
      S.cancelNote=null; S.reissue={no:n.no,noteId:n.id,clientId:n.clientId,ids:n.unitIds.slice(),clientRef:n.clientRef,deliveredBy:n.deliveredBy,receivedBy:n.receivedBy,remarks:n.remarks};
      S.dnClient=n.clientId; S.dnFrom=''; S.dnTo=''; dnKey='';
      toast(n.no+' cancelled. Its units are back in Ready.'); window.scrollTo({top:0,behavior:'smooth'});
    }catch(err){ writeErr(err) }
    renderDelivery(); return
  }
  if(t.id==='dn-create'){
    if(!guardWrite())return; const ids=[...dnSel].filter(id=>{const u=unitById(id);return u&&u.status==='ready'}); if(!ids.length) return;
    t.disabled=true; t.textContent='Creating…';
    try{
      const date=$('#dn-date').value||today(); const yr=date.slice(0,4); const n=await nextSeq('dn'+yr); const no='DN-'+yr+'-'+String(n).padStart(4,'0');
      const ref=S.db.collection('notes').doc();
      const note={no,date,clientId:S.dnClient,unitIds:ids,clientRef:$('#dn-ref').value.trim(),deliveredBy:$('#dn-by').value.trim(),receivedBy:$('#dn-recv').value.trim(),remarks:$('#dn-rem').value.trim(),createdAt:Date.now(),by:S.myId||null};
      const RS=(S.reissue&&S.reissue.clientId===S.dnClient)?S.reissue:null; if(RS) note.replaces=RS.no;
      await ref.set(note);
      if(RS){ try{ await S.db.doc('notes/'+RS.noteId).update({replacedBy:no}) }catch(e){} S.reissue=null }
      for(const id of ids){ await S.db.doc('units/'+id).update({status:'delivered',noteId:ref.id,noteNo:no,deliveredAt:date,deliveredTime:nowHM(),updatedAt:Date.now()}) }
      logAct('Delivery note issued',no,clientById(S.dnClient).name+' · '+ids.length+' units'+(note.replaces?' · replaces '+note.replaces:''));
      toast(no+' created'); dnKey='';
      try{ await pdfDelivery({...note,id:ref.id}); if(ids.some(id=>{const u=unitById(id);return u&&u.svc&&u.svc.condemned})) await pdfCondemned({...note,id:ref.id}) }catch(err){toast(err.message)}
    }catch(err){ writeErr(err) }
    renderDelivery();
  }
});

function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

/* Small document store on top of the "docs" table, with live updates */
function makeDB(sb){
  const listeners=new Set();
  const parentOf=p=>p.slice(0,p.lastIndexOf('/'));
  const idOf=p=>p.slice(p.lastIndexOf('/')+1);
  const clean=o=>JSON.parse(JSON.stringify(o));
  const newId=()=>{ const c='abcdefghijklmnopqrstuvwxyz0123456789'; let s=''; for(const b of crypto.getRandomValues(new Uint8Array(20))) s+=c[b%36]; return s };
  const colSnap=rows=>({docs:rows.map(r=>({id:idOf(r.path),data:()=>r.data}))});
  async function fetchCol(p){ let all=[]; for(let off=0;;off+=1000){ const {data,error}=await sb.from('docs').select('path,data').eq('parent',p).range(off,off+999); if(error) throw dbErr(error); all=all.concat(data); if(data.length<1000) break } return all }
  async function fetchDoc(p){ const {data,error}=await sb.from('docs').select('path,data').eq('path',p).maybeSingle(); if(error) throw dbErr(error); return data }
  function refresh(l){ clearTimeout(l.t); l.t=setTimeout(async()=>{ try{ if(l.kind==='col') l.cb(colSnap(await fetchCol(l.key))); else { const r=await fetchDoc(l.key); l.cb({exists:!!r,id:idOf(l.key),data:()=>r?r.data:undefined}) } }catch(e){ l.err&&l.err(e) } },50) }
  function poke(path){ listeners.forEach(l=>{ if((l.kind==='doc'&&l.key===path)||(l.kind==='col'&&l.key===parentOf(path))) refresh(l) }) }
  const refreshAll=()=>listeners.forEach(refresh);
  function docRef(path){ return {
    id:idOf(path), path,
    async get(){ const r=await fetchDoc(path); return {exists:!!r,id:idOf(path),data:()=>r?r.data:undefined} },
    async set(d){ const {error}=await sb.from('docs').upsert({path,parent:parentOf(path),data:clean(d)},{onConflict:'path'}); if(error) throw dbErr(error); poke(path) },
    async update(p){ const {error}=await sb.rpc('doc_update',{p_path:path,p_patch:clean(p)}); if(error) throw dbErr(error); poke(path) },
    async delete(){ const {error}=await sb.from('docs').delete().eq('path',path); if(error) throw dbErr(error); poke(path) },
    onSnapshot(cb,err){ const l={kind:'doc',key:path,cb,err}; listeners.add(l); refresh(l); return ()=>listeners.delete(l) }
  }}
  function colRef(p){ return { path:p, doc:id=>docRef(p+'/'+(id||newId())),
    async get(){ return colSnap(await fetchCol(p)) },
    onSnapshot(cb,err){ const l={kind:'col',key:p,cb,err}; listeners.add(l); refresh(l); return ()=>listeners.delete(l) } } }
  sb.channel('docs-live').on('postgres_changes',{event:'*',schema:'public',table:'docs'},pl=>{ const p=(pl.new&&pl.new.path)||(pl.old&&pl.old.path); if(p) poke(p); else refreshAll() })
    .subscribe(st=>{ if(st==='SUBSCRIBED') refreshAll() });
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshAll() });
  window.addEventListener('online',refreshAll);
  setInterval(()=>{ if(!document.hidden) refreshAll() },120000);
  return { collection:colRef, doc:docRef, refreshAll };
}

async function restoreBackup(file){
  if(!S.isOwner) return; const st=$('#rs-status'); const say=m=>{ if(st) st.textContent=m };
  try{
    say('Reading '+file.name+'…'); const X=await getXLSX(); const wb=X.read(await file.arrayBuffer(),{type:'array'});
    const ws=wb.Sheets['Restore data']; if(!ws){ say('This file has no "Restore data" sheet.'); return }
    const rows=X.utils.sheet_to_json(ws,{header:1,defval:''}).slice(1).filter(r=>r&&r[0]&&r[1]);
    const cur=await S.db.doc('meta/settings').get(); const curSet=cur.exists?cur.data():{};
    const docs=[]; const maxN={};
    const bump=(k,n)=>{ if(n>(maxN[k]||0)) maxN[k]=n };
    for(const r of rows){ const col=String(r[0]), id=String(r[1]); if(!['units','clients','notes','meta'].includes(col)) continue; if(col==='meta'&&id!=='settings') continue;
      let d=JSON.parse(r.slice(2).map(String).join(''));
      if(col==='meta'){ d={...curSet,...d}; delete d.techs; if(curSet.logo){ d.logo=curSet.logo; d.logoW=curSet.logoW; d.logoH=curSet.logoH } }
      if(col==='units'&&d.tag){ const m=String(d.tag).match(/-(\d{2})-(\d{4})$/); if(m) bump('tag20'+m[1],+m[2]) }
      if(col==='notes'&&d.no){ const m=String(d.no).match(/^DN-(\d{4})-(\d{4})/); if(m) bump('dn'+m[1],+m[2]) }
      docs.push({path:col+'/'+id,parent:col,data:d}) }
    if(!docs.length){ say('Nothing to restore in this file.'); return }
    say('Saving '+docs.length+' records…');
    for(let i=0;i<docs.length;i+=200){ const {error}=await S.sb.from('docs').upsert(docs.slice(i,i+200),{onConflict:'path'}); if(error) throw dbErr(error) }
    for(const [k,n] of Object.entries(maxN)){ const {error}=await S.sb.rpc('set_counter_min',{p_key:k,p_val:n}); if(error) throw dbErr(error) }
    const c=s=>docs.filter(d=>d.parent===s).length;
    logAct('Backup restored',file.name,c('units')+' extinguishers, '+c('clients')+' clients, '+c('notes')+' notes');
    say('Restored '+c('units')+' extinguishers, '+c('clients')+' clients and '+c('notes')+' delivery notes.'); toast('Backup restored'); S.db.refreshAll();
  }catch(err){ console.error(err); say('Restore failed: '+((err&&err.message)||'error')) }
}

function libConfig(){
  const F=window.Html5QrcodeSupportedFormats; const c={verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}};
  if(F) c.formatsToSupport=['QR_CODE','CODE_128','CODE_39','CODE_93','EAN_13','EAN_8','UPC_A','UPC_E','ITF','CODABAR','DATA_MATRIX','PDF_417'].map(k=>F[k]).filter(v=>v!==undefined);
  return c;
}
renderPhotoBox=function(){
  const b=$('#in-photo'); if(!b) return; b.hidden=false;
  b.innerHTML=`<div class="photo"><div><b>Read barcodes or QR code</b><div class="small muted">Take a photo of the label: the serial and model barcodes (or the QR code) are read and filled in. Fill the photo with the label, straight on and sharp.</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn pri" for="sc-cap">Take photo of label</label><input type="file" id="sc-cap" accept="image/*" capture="environment" hidden><label class="btn" for="sc-file">Choose photo</label><input type="file" id="sc-file" accept="image/*" hidden></div></div>`;
};
function stopCam(){ if(scanner){ const s=scanner; scanner=null; try{ s.stop().then(()=>{try{s.clear()}catch(e){}}).catch(()=>{}) }catch(e){} } }
function closeScanner(){ stopCam(); const r=$('#scanRoot'); if(r) r.remove() }
function scanShell(title){
  closeScanner(); SC={codes:[]}; const r=document.createElement('div'); r.id='scanRoot'; r.className='scanwrap';
  r.innerHTML='<div class="scanbox" role="dialog" aria-label="'+esc(title)+'"><div class="scanhead"><b>'+esc(title)+'</b><button type="button" class="btn sm" id="sc-close">Close</button></div><div id="sc-cam"></div><div id="sc-msg" class="small muted"></div><div id="sc-out"></div></div>';
  document.body.appendChild(r); return r;
}
const scMsg=m=>{ const e=$('#sc-msg'); if(e) e.innerHTML=m };
const isQRfmt=f=>/QR|DATA_MATRIX|PDF/i.test(f||'');
function parseLabelled(text){
  const t=String(text||''); const out={};
  const grab=re=>{ const m=t.match(re); return m?m[1].trim().replace(/[;,|]+$/,''):'' };
  out.model=grab(/(?:model|modelo|mod\.?|p\/n|part\s*(?:no|number))\s*[:=#]?\s*([^\n\r;|,]+)/i);
  out.serial=grab(/(?:serial|s\/n|sn)\s*(?:no\.?|number|#)?\s*[:=#]\s*([^\n\r;|,]+)/i);
  out.brand=grab(/(?:brand|mfr|manufacturer|make)\s*[:=]\s*([^\n\r;|,]+)/i);
  let m=t.match(/(?:mfg|manufactured|mfd|date)[^0-9]{0,12}(\d{4})[-\/.](\d{1,2})\b/i), y, mo;
  if(m){ y=m[1]; mo=m[2] } else { m=t.match(/(?:mfg|manufactured|mfd|date)[^0-9]{0,12}(\d{1,2})[-\/.](\d{4})\b/i); if(m){ mo=m[1]; y=m[2] } }
  if(y&&+mo>=1&&+mo<=12) out.mfg=y+'-'+String(mo).padStart(2,'0');
  Object.keys(out).forEach(k=>{ if(!out[k]) delete out[k] });
  return out;
}
const digitShare=s=>{ const x=String(s).replace(/[^A-Za-z0-9]/g,''); return x?x.replace(/\D/g,'').length/x.length:0 };
// Decide which field each code goes to: labelled QR text is split; otherwise the most numeric barcode is the serial, the other the model
function guessRoles(codes){
  const used=new Set();
  codes.forEach(c=>{ c.parsed=isQRfmt(c.fmt)||/[:=]/.test(c.text)?parseLabelled(c.text):{}; c.role=Object.keys(c.parsed).length?'parsed':'' });
  const plain=codes.filter(c=>!c.role&&!/^https?:\/\//i.test(c.text));
  const byNum=[...plain].sort((a,b)=>digitShare(b.text)-digitShare(a.text));
  if(byNum.length===1) byNum[0].role=isQRfmt(byNum[0].fmt)?'model':(digitShare(byNum[0].text)>=0.6?'serial':'model');
  else if(byNum.length>=2){ byNum[0].role='serial'; byNum[1].role='model'; byNum.slice(2).forEach(c=>c.role='skip') }
  codes.forEach(c=>{ if(!c.role) c.role='skip' });
  return codes;
}
function addCode(text,fmt){
  text=String(text||'').trim(); if(!text||SC.codes.some(c=>c.text===text)) return false;
  SC.codes.push({text,fmt:fmt||''}); guessRoles(SC.codes); if(navigator.vibrate) navigator.vibrate(50); drawCodes(); return true;
}
function drawCodes(){
  const o=$('#sc-out'); if(!o) return;
  if(!SC.codes.length){ o.innerHTML=''; return }
  const opts=[['serial','Serial number'],['model','Model'],['brand','Brand'],['skip','Ignore']];
  o.innerHTML='<div class="sclist">'+SC.codes.map((c,i)=>{ const pk=Object.keys(c.parsed||{});
    return '<div class="scrow"><div style="min-width:0;flex:1"><div class="mono" style="word-break:break-all">'+esc(c.text)+'</div><div class="small muted">'+esc(isQRfmt(c.fmt)?'QR code':(c.fmt||'Barcode').replace(/_/g,' '))+(pk.length?' · found '+pk.map(k=>({brand:'brand',model:'model',serial:'serial',mfg:'mfg date'})[k]).join(', '):'')+(/^https?:\/\//i.test(c.text)?' · <a href="'+esc(c.text)+'" target="_blank" rel="noopener">open link</a>':'')+'</div></div>'+
      '<select data-scrole="'+i+'" aria-label="Field for this code">'+(pk.length?'<option value="parsed"'+(c.role==='parsed'?' selected':'')+'>Fill found fields</option>':'')+opts.map(([k,l])=>'<option value="'+k+'"'+(c.role===k?' selected':'')+'>'+l+'</option>').join('')+'</select></div>' }).join('')+'</div>'+
    '<div class="scanact" style="margin-top:10px"><button type="button" class="btn pri" id="sc-apply">Fill the fields</button>'+'<label class="btn sm" for="sc-cap2">Take another photo</label><input type="file" id="sc-cap2" accept="image/*" capture="environment" hidden>'+'</div>';
}
function fillField(id,val){ const el=$('#'+id); if(!el||!val) return; el.value=val; el.classList.add('filled'); el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true})) }
function applyCodes(){
  let n=0;
  SC.codes.forEach(c=>{ if(c.role==='parsed'){ const f=c.parsed||{}; ['brand','model','serial','mfg'].forEach(k=>{ if(f[k]){ fillField('in-'+k,f[k]); n++ } }) }
    else if(['serial','model','brand'].includes(c.role)){ fillField('in-'+c.role,c.text); n++ } });
  if(typeof updateIntakeAlerts==='function') try{updateIntakeAlerts()}catch(x){}
  closeScanner(); toast(n?'Filled from the label. Check it against the unit.':'Nothing was filled.');
}
async function startCamera(){
  scanShell('Scan with camera'); scMsg('Starting camera…');
  try{ const L=await getScanLib(); if(!$('#scanRoot')) return;
    const sc=new L('sc-cam',libConfig()); scanner=sc;
    await sc.start({facingMode:'environment'},{fps:12,disableFlip:true,
        qrbox:(w,h)=>({width:Math.round(w*0.92),height:Math.round(Math.max(90,Math.min(h*0.42,w*0.5)))}),
        videoConstraints:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:'continuous'}]}},
      (text,res)=>{ addCode(text,res&&res.result&&res.result.format&&res.result.format.formatName); scMsg('Got '+SC.codes.length+' code'+(SC.codes.length>1?'s':'')+'. Point at the next code, or tap <b>Fill the fields</b>.') },()=>{});
    if(!SC.codes.length) scMsg('Show <b>one code at a time</b> across the box, 10–20 cm away. Each code read is added below.');
  }catch(e){ scanner=null; const cam=$('#sc-cam'); if(cam) cam.style.display='none';
    scMsg(esc(/permission|notallowed/i.test(String(e&&e.name||e))?'Camera access was blocked. Allow the camera for this site in the browser settings.':((e&&e.message)||String(e)||'The camera could not start.'))+' You can also close this and use <b>From photo</b>.') }
}
function loadImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=u }) }
function canvasPart(img,sx,sy,sw,sh,scale,rot){
  const c=document.createElement('canvas'); const w=Math.round(sw*scale), h=Math.round(sh*scale);
  if(rot){ c.width=h; c.height=w; const x=c.getContext('2d'); x.translate(h/2,w/2); x.rotate(Math.PI/2); x.drawImage(img,sx,sy,sw,sh,-w/2,-h/2,w,h) }
  else { c.width=w; c.height=h; c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,w,h) }
  return c;
}
const toFile=c=>new Promise(r=>c.toBlob(b=>r(new File([b],'part.jpg',{type:'image/jpeg'})),'image/jpeg',0.92));
async function scanPhoto(file){
  scanShell('Read from photo'); const cam=$('#sc-cam'); if(cam) cam.style.display='none'; scMsg('Reading the photo…');
  let host=null;
  try{
    const img=await loadImg(file); const W=img.naturalWidth, H=img.naturalHeight; const scale=Math.min(1,2600/Math.max(W,H));
    const found=(t,f)=>addCode(t,f);
    if('BarcodeDetector' in window){ try{ const det=new BarcodeDetector(); for(const rot of [false,true]){ const r=await det.detect(canvasPart(img,0,0,W,H,scale,rot)); r.forEach(x=>found(x.rawValue,(x.format||'').toUpperCase())); if(SC.codes.length) break } }catch(e){} }
    if(!SC.codes.length){
      const L=await getScanLib(); host=document.createElement('div'); host.id='sc-tmp'; host.style.cssText='position:fixed;left:-20000px;top:0;width:5000px;height:20px;overflow:hidden'; document.body.appendChild(host);
      const sc=new L('sc-tmp',libConfig());
      const tryC=async c=>{ try{ const r=await sc.scanFileV2(await toFile(c),false); found(r.decodedText,r.result&&r.result.format&&r.result.format.formatName) }catch(e){} };
      for(const rot of [false,true]){
        await tryC(canvasPart(img,0,0,W,H,scale,rot));
        // look band by band so several barcodes on one label are all found
        const along=rot?W:H, n=10;
        for(let i=0;i<n-1;i++){ const a=Math.round(along*i/n), len=Math.round(along*2/n); scMsg('Reading the photo… '+Math.round((i+1)/(n-1)*100)+'%');
          await tryC(rot?canvasPart(img,a,0,len,H,scale,true):canvasPart(img,0,a,W,len,scale,false)) }
        if(SC.codes.length) break;
      }
      try{ sc.clear() }catch(e){}
    }
    scMsg(SC.codes.length?'Found '+SC.codes.length+' code'+(SC.codes.length>1?'s':'')+'. Check where each one goes, then tap <b>Fill the fields</b>.':'No barcode or QR code could be read. Take the photo closer and straight on, in good light, with the codes sharp. Or use <b>Scan with camera</b>.');
    drawCodes();
  }catch(e){ scMsg('The photo could not be read: '+esc((e&&e.message)||'error')) }
  finally{ if(host) host.remove() }
}
document.addEventListener('click',e=>{ const t=e.target;
  if(t.id==='sc-open'||t.id==='sc-again'){ startCamera(); return }
  if(t.id==='sc-close'){ closeScanner(); return }
  if(t.id==='sc-apply'){ applyCodes(); return }
});
document.addEventListener('change',e=>{
  if(['sc-file','sc-cap','sc-cap2'].includes(e.target.id)&&e.target.files[0]){ const f=e.target.files[0]; e.target.value=''; scanPhoto(f) }
  if(e.target.dataset&&e.target.dataset.scrole!==undefined){ const c=SC.codes[+e.target.dataset.scrole]; if(c) c.role=e.target.value }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('#scanRoot')) closeScanner() });

/* ---------- brand picker (intake + record editor) ---------- */
const BRANDS_USA=['Amerex','Ansul','Badger','Buckeye','First Alert','General','H3R Aviation','Kidde','Potter Roemer','Pyro-Chem','Range Guard','Strike First'];
const BRANDS_INTL=['Bavaria','Gloria','Minimax'];
function brandPicker(id){
  const inp=$('#'+id); if(!inp||inp.dataset.bp) return; inp.dataset.bp='1';
  const known=BRANDS_USA.concat(BRANDS_INTL); const lc=s=>s.toLowerCase();
  const hist=[...new Set(S.units.map(u=>(u.brand||'').trim()).filter(b=>b&&!known.some(k=>lc(k)===lc(b))))].sort((a,b)=>a.localeCompare(b));
  const opt=b=>'<option value="'+esc(b)+'">'+esc(b)+'</option>';
  const sel=document.createElement('select'); sel.id=id+'-sel'; sel.setAttribute('aria-label','Brand'); sel.disabled=inp.disabled;
  sel.innerHTML='<option value="">Select brand…</option><optgroup label="USA manufacturers">'+BRANDS_USA.map(opt).join('')+'</optgroup><optgroup label="Other manufacturers">'+BRANDS_INTL.concat(hist).map(opt).join('')+'</optgroup><option value="__other">Other (type the brand)…</option>';
  inp.parentNode.insertBefore(sel,inp); inp.removeAttribute('list'); inp.placeholder='Type the brand';
  const show=v=>{ inp.style.display=v?'':'none'; if(v) inp.style.marginTop='6px' };
  const sync=()=>{ if(inp._skip) return; const v=inp.value.trim(); const m=[...sel.options].find(x=>x.value&&x.value!=='__other'&&lc(x.value)===lc(v));
    if(!v){ if(sel.value!=='__other'){ sel.value=''; show(false) } } else if(m){ sel.value=m.value; show(false) } else { sel.value='__other'; show(true) }
    sel.classList.toggle('filled',inp.classList.contains('filled')) };
  sel.addEventListener('change',()=>{ inp._skip=true;
    if(sel.value==='__other'){ if(known.concat(hist).some(k=>lc(k)===lc(inp.value.trim()))) inp.value=''; show(true); inp.focus() } else { inp.value=sel.value; show(false) }
    inp.dispatchEvent(new Event('input',{bubbles:true})); inp.dispatchEvent(new Event('change',{bubbles:true})); inp._skip=false });
  inp.addEventListener('input',sync); inp.addEventListener('change',sync); inp.addEventListener('bpsync',sync); sync();
}
const _renderIntakeBP=renderIntake;
renderIntake=function(){ _renderIntakeBP(); brandPicker('in-brand') };
const _drawDrawerBP=drawDrawer;
drawDrawer=function(){ _drawDrawerBP(); brandPicker('ed-brand') };
document.addEventListener('click',e=>{ if(e.target.id==='in-fill') setTimeout(()=>{ const b=$('#in-brand'); b&&b.dispatchEvent(new Event('bpsync')) },0) });

boot();
